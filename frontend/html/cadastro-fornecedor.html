<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Fornecedor - Helix Health</title>
  <link rel="stylesheet" href="../style/style.css?v=4">
</head>
<body>
  <main>
    <header>
      <div class="header-actions">
        <a href="portal-usuario.html" class="voltar">Portal</a>
        <a href="listar-fornecedor.html" class="voltar">Listar fornecedores</a>
      </div>

      <p class="eyebrow" id="modoPagina">Cadastro</p>
      <h1 id="tituloPagina">Cadastro de Fornecedor</h1>
      <p id="descricaoPagina">Registre empresas fornecedoras de medicamentos, materiais e insumos hospitalares.</p>
    </header>

    <form id="formFornecedor">
      <div class="linha">
        <div class="campo">
          <label for="nome">Nome do fornecedor</label>
          <input type="text" id="nome" placeholder="Ex: Health Supply" required>
        </div>

        <div class="campo">
          <label for="cnpj">CNPJ</label>
          <input type="text" id="cnpj" placeholder="Ex: 12.345.678/0001-90" required>
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="text" id="telefone" placeholder="Ex: (11) 99999-9999" required>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="Ex: contato@fornecedor.com" required>
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="endereco">Endereco</label>
          <input type="text" id="endereco" placeholder="Ex: Rua das Flores, 100" required>
        </div>

        <div class="campo">
          <label for="ativo">Status</label>
          <select id="ativo">
            <option value="true">Ativo</option>
            <option value="false">Inativo</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="botaoSalvar">Cadastrar fornecedor</button>
        <a href="listar-fornecedor.html" class="secondary-link">Cancelar</a>
      </div>
    </form>

    <p id="mensagem"></p>
  </main>

  <script src="../script/auth.js?v=6"></script>
  <script src="../script/mensagens.js?v=1"></script>
  <script src="../script/cadastro-fornecedor.js?v=1"></script>
</body>
</html>
