<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Leito - Helix Health</title>
  <link rel="stylesheet" href="../style/style.css?v=3">
</head>
<body>
  <main>
    <header>
      <div class="header-actions">
        <a href="portal-usuario.html" class="voltar">Portal</a>
        <a href="portal-seletor.html" class="voltar">Trocar portal</a>
      </div>

      <p class="eyebrow" id="modoPagina">Cadastro</p>
      <h1 id="tituloPagina">Cadastro de Leito</h1>
      <p id="descricaoPagina">Registre leitos, quartos e setores para controlar ocupacao hospitalar.</p>
    </header>

    <form id="formLeito">
      <div class="linha">
        <div class="campo">
          <label for="numero">Numero do leito</label>
          <input type="text" id="numero" placeholder="Ex: 101A" required>
        </div>

        <div class="campo">
          <label for="quarto">Quarto</label>
          <input type="text" id="quarto" placeholder="Ex: 101" required>
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="setor">Setor</label>
          <input type="text" id="setor" placeholder="Ex: UTI, Enfermaria, Pediatria" required>
        </div>

        <div class="campo">
          <label for="statusLeito">Status</label>
          <select id="statusLeito" required>
            <option value="">Selecione</option>
            <option value="DISPONIVEL">Disponivel</option>
            <option value="OCUPADO">Ocupado</option>
            <option value="MANUTENCAO">Manutencao</option>
            <option value="BLOQUEADO">Bloqueado</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="botaoSalvar">Cadastrar leito</button>
        <a href="portal-usuario.html" class="secondary-link">Cancelar</a>
      </div>
    </form>

    <p id="mensagem"></p>
  </main>

  <script src="../script/auth.js?v=6"></script>
  <script src="../script/mensagens.js?v=1"></script>
  <script src="../script/cadastro-leito.js?v=2"></script>
</body>
</html>
