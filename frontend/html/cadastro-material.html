<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Material - Helix Health</title>
  <link rel="stylesheet" href="../style/style.css?v=4">
</head>
<body>
  <main>
    <header>
      <div class="header-actions">
        <a href="portal-usuario.html" class="voltar">Portal</a>
        <a href="listar-material.html" class="voltar">Listar materiais</a>
      </div>

      <p class="eyebrow" id="modoPagina">Cadastro</p>
      <h1 id="tituloPagina">Cadastro de Material</h1>
      <p id="descricaoPagina">Registre materiais hospitalares, estoque, fornecedor e validade.</p>
    </header>

    <form id="formMaterial">
      <div class="linha">
        <div class="campo">
          <label for="nome">Nome do material</label>
          <input type="text" id="nome" placeholder="Ex: Luva descartavel" required>
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" required>
            <option value="">Selecione</option>
            <option value="Descartavel">Descartavel</option>
            <option value="Higiene">Higiene</option>
            <option value="Protecao">Protecao</option>
            <option value="Curativo">Curativo</option>
            <option value="Instrumental">Instrumental</option>
            <option value="Limpeza">Limpeza</option>
            <option value="Outro">Outro</option>
          </select>
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="quantidadeEstoque">Quantidade em estoque</label>
          <input type="number" id="quantidadeEstoque" min="0" required>
        </div>

        <div class="campo">
          <label for="estoqueMinimo">Estoque minimo</label>
          <input type="number" id="estoqueMinimo" min="0" required>
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="unidadeMedida">Unidade de medida</label>
          <select id="unidadeMedida" required>
            <option value="">Selecione</option>
            <option value="Unidade">Unidade</option>
            <option value="Caixa">Caixa</option>
            <option value="Pacote">Pacote</option>
            <option value="Rolo">Rolo</option>
            <option value="Par">Par</option>
            <option value="Litro">Litro</option>
            <option value="Metro">Metro</option>
          </select>
        </div>

        <div class="campo">
          <label for="dataValidade">Data de validade</label>
          <input type="date" id="dataValidade">
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="fornecedor">Fornecedor</label>
          <input type="text" id="fornecedor" placeholder="Ex: Health Supply" required>
        </div>

        <div class="campo">
          <label for="statusAlmoxarifado">Status</label>
          <select id="statusAlmoxarifado">
            <option value="">Automatico</option>
            <option value="DISPONIVEL">Disponivel</option>
            <option value="BAIXO_ESTOQUE">Baixo estoque</option>
            <option value="VENCIDO">Vencido</option>
            <option value="INDISPONIVEL">Indisponivel</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="botaoSalvar">Cadastrar material</button>
        <a href="listar-material.html" class="secondary-link">Cancelar</a>
      </div>
    </form>

    <p id="mensagem"></p>
  </main>

  <script src="../script/auth.js?v=6"></script>
  <script src="../script/mensagens.js?v=1"></script>
  <script src="../script/cadastro-material.js?v=1"></script>
</body>
</html>
