<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Medicamento - Helix Health</title>
  <link rel="stylesheet" href="../style/style.css?v=4">
</head>
<body>
  <main>
    <header>
      <div class="header-actions">
        <a href="portal-usuario.html" class="voltar">Portal</a>
        <a href="listar-medicamento.html" class="voltar">Listar medicamentos</a>
      </div>

      <p class="eyebrow" id="modoPagina">Cadastro</p>
      <h1 id="tituloPagina">Cadastro de Medicamento</h1>
      <p id="descricaoPagina">Registre medicamentos, estoque minimo, fornecedor e validade.</p>
    </header>

    <form id="formMedicamento">
      <div class="linha">
        <div class="campo">
          <label for="nome">Nome do medicamento</label>
          <input type="text" id="nome" placeholder="Ex: Dipirona" required>
        </div>

        <div class="campo">
          <label for="principioAtivo">Principio ativo</label>
          <input type="text" id="principioAtivo" placeholder="Ex: Metamizol sodico">
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="dosagem">Dosagem</label>
          <input type="text" id="dosagem" placeholder="Ex: 500mg">
        </div>

        <div class="campo">
          <label for="formaFarmaceutica">Forma farmaceutica</label>
          <input type="text" id="formaFarmaceutica" placeholder="Ex: Comprimido, Solucao, Capsula">
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="quantidadeEstoque">Quantidade em estoque</label>
          <input type="number" id="quantidadeEstoque" min="0" required>
        </div>

        <div class="campo">
          <label for="estoqueMinimo">Estoque minimo</label>
          <input type="number" id="estoqueMinimo" min="0" required>
        </div>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="dataValidade">Data de validade</label>
          <input type="date" id="dataValidade" required>
        </div>

        <div class="campo">
          <label for="fornecedor">Fornecedor</label>
          <input type="text" id="fornecedor" placeholder="Ex: MedFarma">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="botaoSalvar">Cadastrar medicamento</button>
        <a href="listar-medicamento.html" class="secondary-link">Cancelar</a>
      </div>
    </form>

    <p id="mensagem"></p>
  </main>

  <script src="../script/auth.js?v=6"></script>
  <script src="../script/mensagens.js?v=1"></script>
  <script src="../script/cadastro-medicamento.js?v=1"></script>
</body>
</html>
