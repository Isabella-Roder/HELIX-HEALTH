<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitos - Helix Health</title>
  <link rel="stylesheet" href="../style/style.css?v=3">
</head>
<body>
  <header class="topbar">
    <a href="portal-usuario.html" class="brand">Helix Health</a>

    <nav class="menu">
      <a href="portal-usuario.html">Portal</a>
      <a href="cadastro-leito.html">Cadastrar leito</a>
      <a href="portal-seletor.html">Trocar portal</a>
      <a href="#" id="botaoSair">Sair</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-header">
      <div>
        <p class="eyebrow">Leitos</p>
        <h1>Lista de leitos</h1>
        <p class="subtitle">Acompanhe a disponibilidade, setores e quartos dos leitos hospitalares.</p>
      </div>

      <a class="primary-link" href="cadastro-leito.html">Novo leito</a>
    </section>

    <section class="filter-panel">
      <div class="filter-field">
        <label for="filtroStatus">Status</label>
        <select id="filtroStatus">
          <option value="">Todos os status</option>
          <option value="DISPONIVEL">Disponivel</option>
          <option value="OCUPADO">Ocupado</option>
          <option value="MANUTENCAO">Manutencao</option>
          <option value="BLOQUEADO">Bloqueado</option>
        </select>
      </div>

      <div class="filter-field">
        <label for="filtroSetor">Setor</label>
        <input type="text" id="filtroSetor" placeholder="Ex: UTI">
      </div>

      <div class="filter-actions">
        <button type="button" id="botaoFiltrar">Filtrar</button>
        <button type="button" id="botaoLimparFiltro">Limpar</button>
      </div>
    </section>

    <section class="table-panel">
      <div class="table-toolbar">
        <span id="totalLeitos">0 leitos encontrados</span>
        <button type="button" id="botaoAtualizar">Atualizar</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Numero</th>
              <th>Quarto</th>
              <th>Setor</th>
              <th>Status</th>
              <th>Acoes</th>
            </tr>
          </thead>
          <tbody id="tabelaLeitos">
            <tr>
              <td colspan="6" class="empty">Carregando leitos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <p id="mensagem"></p>
  </main>

  <script src="../script/auth.js?v=6"></script>
  <script src="../script/listar-leito.js"></script>
</body>
</html>
